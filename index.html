<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
        }
        header {
            background: #1e3a8a;
            color: white;
            padding: 24px;
            text-align: center;
        }
        nav {
            background: white;
            padding: 15px;
            text-align: center;
        }
        main {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        input, button {
            padding: 10px;
            margin: 5px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background: #dbeafe;
        }
        #message {
            color: #dc2626;
        }
    </style>
</head>
<body>
    <header>
        <h1>Employee Management System</h1>
        <p>Manage your employees in one place</p>
    </header>

    <nav>
        <strong>Dashboard | Employees</strong>
    </nav>

    <main>
        <h2>Employee Dashboard</h2>
        <p>Total Employees: <strong id="employeeCount">2</strong></p>

        <h3>Add Employee</h3>
        <input id="employeeName" placeholder="Employee name">
        <input id="employeeRole" placeholder="Job role">
        <button id="addEmployee" onclick="addEmployee()">Add Employee</button>

        <p id="message"></p>

        <h3>Employee List</h3>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Job Role</th>
                </tr>
            </thead>
            <tbody id="employeeList">
                <tr><td>Arun</td><td>Business Analyst</td></tr>
                <tr><td>Kamal</td><td>QA Engineer</td></tr>
            </tbody>
        </table>
    </main>

    <script>
        function addEmployee() {
            const name = document.getElementById("employeeName").value.trim();
            const role = document.getElementById("employeeRole").value.trim();
            const message = document.getElementById("message");

            if (name === "" || role === "") {
                message.textContent = "Please enter both name and job role.";
                return;
            }

            const row = document.createElement("tr");
            row.innerHTML = `<td>${name}</td><td>${role}</td>`;
            document.getElementById("employeeList").appendChild(row);

            const count = document.getElementById("employeeCount");
            count.textContent = Number(count.textContent) + 1;

            message.style.color = "green";
            message.textContent = "Employee added successfully.";

            document.getElementById("employeeName").value = "";
            document.getElementById("employeeRole").value = "";
        }
    </script>
</body>
</html>
